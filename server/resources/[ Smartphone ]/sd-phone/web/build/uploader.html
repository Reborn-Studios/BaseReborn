<!doctype html>
<meta charset="utf-8">
<title>sd-phone uploader</title>
<script>
(function () {
    var trustedOrigin = 'https://cfx-nui-' + location.host;
    var uploadUrlShape = /^http:\/\/[^\/]+\/[^\/]+\/upload\/[0-9a-f]{32}$/;
    var mimeShape = /^[a-z]+\/[a-z0-9.+-]+$/i;
    var smallestPartBytes = 64 * 1024;
    var prefixRoom = 256;

    function encodeBlob(blob) {
        return new Promise(function (resolve, reject) {
            var reader = new FileReader();
            reader.onerror = function () { reject(new Error('read failed')); };
            reader.onload = function () {
                var value = typeof reader.result === 'string' ? reader.result : '';
                var comma = value.indexOf(',');
                resolve(comma >= 0 ? value.slice(comma + 1) : '');
            };
            reader.readAsDataURL(blob);
        });
    }

    function planParts(body, partBytes) {
        if (typeof body === 'string') {
            var count = Math.max(1, Math.ceil(body.length / partBytes));
            return {
                total: count,
                read: function (index) { return Promise.resolve(body.slice(index * partBytes, (index + 1) * partBytes)); },
            };
        }
        var mime = (body.type || '').split(';')[0];
        if (!mimeShape.test(mime)) return null;
        var rawBytes = Math.floor((partBytes - prefixRoom) / 4) * 3;
        var prefix = 'data:' + mime + ';base64,';
        return {
            total: Math.max(1, Math.ceil(body.size / rawBytes)),
            read: function (index) {
                return encodeBlob(body.slice(index * rawBytes, (index + 1) * rawBytes)).then(function (encoded) {
                    return index === 0 ? prefix + encoded : encoded;
                });
            },
        };
    }

    async function sendAll(url, body, partBytes) {
        var plan = planParts(body, partBytes);
        if (!plan) return { ok: false };
        var answer = null;
        for (var index = 0; index < plan.total; index++) {
            var part = await plan.read(index);
            var res = await fetch(url + '/' + (index + 1) + '/' + plan.total, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain' },
                body: part,
            });
            if (!res.ok) return { ok: false };
            answer = await res.json().catch(function () { return null; });
        }
        return { ok: true, result: answer && answer.result };
    }

    window.addEventListener('message', function (event) {
        var msg = event.data;
        if (event.source !== window.parent || event.origin !== trustedOrigin) return;
        if (!msg || msg.kind !== 'sd-phone:upload' || typeof msg.url !== 'string') return;
        if (typeof msg.body !== 'string' && !(msg.body instanceof Blob)) return;
        if (!uploadUrlShape.test(msg.url)) return;
        if (typeof msg.partBytes !== 'number' || !(msg.partBytes >= smallestPartBytes)) return;

        var answer = function (outcome) {
            window.parent.postMessage({ kind: 'sd-phone:upload:result', id: msg.id, ok: outcome.ok, result: outcome.result }, trustedOrigin);
        };

        sendAll(msg.url, msg.body, Math.floor(msg.partBytes))
            .then(answer)
            .catch(function () { answer({ ok: false }); });
    });

    window.parent.postMessage({ kind: 'sd-phone:upload:ready' }, trustedOrigin);
})();
</script>
